name: Build Duplicate Finder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build macOS App and DMG
    runs-on: macos-14

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Swift Version
        run: swift --version

      - name: Projekt bauen
        run: |
          swift build -c release

      - name: App erstellen
        run: |
          set -e

          rm -rf dist
          mkdir -p "dist/Duplicate Finder.app/Contents/MacOS"
          mkdir -p "dist/Duplicate Finder.app/Contents/Resources"

          cp ".build/release/DuplicateFinder" \
             "dist/Duplicate Finder.app/Contents/MacOS/DuplicateFinder"

          chmod +x \
             "dist/Duplicate Finder.app/Contents/MacOS/DuplicateFinder"

          cat > "dist/Duplicate Finder.app/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Duplicate Finder</string>

              <key>CFBundleDisplayName</key>
              <string>Duplicate Finder</string>

              <key>CFBundleExecutable</key>
              <string>DuplicateFinder</string>

              <key>CFBundleIdentifier</key>
              <string>com.tayron.duplicatefinder</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>

              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>

              <key>NSHighResolutionCapable</key>
              <true/>

              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
          </dict>
          </plist>
          EOF

      - name: Icon kopieren
        run: |
          if [ -f "Resources/AppIcon.icns" ]; then
            cp "Resources/AppIcon.icns" \
              "dist/Duplicate Finder.app/Contents/Resources/AppIcon.icns"
          else
            echo "Kein AppIcon.icns gefunden – Build läuft trotzdem weiter."
          fi

      - name: DMG erstellen
        run: |
          set -e

          mkdir -p dmg
          rm -rf dmg/*

          cp -R "dist/Duplicate Finder.app" dmg/

          ln -s /Applications dmg/Applications

          hdiutil create \
            -volname "Duplicate Finder" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            "dist/Duplicate-Finder.dmg"

      - name: Dateien prüfen
        run: |
          echo "=== Dateien ==="
          ls -lh "dist/"

          test -d "dist/Duplicate Finder.app"
          test -f "dist/Duplicate-Finder.dmg"

          echo "✓ App vorhanden"
          echo "✓ DMG vorhanden"

      - name: App und DMG hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Duplicate-Finder-macOS
          path: |
            dist/Duplicate Finder.app
            dist/Duplicate-Finder.dmg
